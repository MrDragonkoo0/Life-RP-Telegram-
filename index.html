<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Life+ RP</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="card" id="registration"><div class="logo">LIFE<span>+</span> RP</div><p class="subtitle">Text MMO Role Play</p><form id="registerForm"><label>Нікнейм<input id="nickname" minlength="3" required></label><label>Ім'я персонажа<input id="characterName" minlength="2" required></label><label>Стать<select id="gender" required><option value="">Оберіть стать</option><option value="male">Чоловік</option><option value="female">Жінка</option></select></label><label>Пароль<input id="password" type="password" minlength="6" required></label><label>Підтвердження пароля<input id="passwordConfirm" type="password" minlength="6" required></label><p class="error" id="error"></p><button type="submit">ЗАРЕЄСТРУВАТИСЬ</button></form></section><section class="card success hidden" id="profile"><div class="logo">LIFE<span>+</span> RP</div><h2>Реєстрацію завершено!</h2><div class="stats"><div><small>Баланс</small><strong>₴1000</strong></div><div><small>Рівень</small><strong>1</strong></div></div><p id="welcome"></p></section></main><script src="app.js"></script></body></html>

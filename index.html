<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>Life+ RP v0.1.4 — повноекранний режим</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <main id="game-root">
    <div id="game"></div>
    <div id="hint">Досліджуй місто</div>
    <button id="fullscreen-btn" type="button" aria-label="Увімкнути повноекранний режим">⛶ На весь екран</button>
    <div id="rotate-overlay" aria-live="polite">
      <div class="rotate-card">
        <div class="rotate-icon">↻</div>
        <strong>Поверни телефон горизонтально</strong>
        <span>Life+ RP найкраще працює в альбомному режимі</span>
        <button id="rotate-fullscreen-btn" type="button">Увімкнути повний екран</button>
      </div>
    </div>
    <div id="help">Рух: джойстик або WASD / стрілки · Біг: кнопка «БІГ» або Shift</div>
  </main>
  <script src="game.js"></script>
</body>
</html>
